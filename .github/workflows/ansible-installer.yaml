name: Generate Install Script

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  generate-install-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate install.sh
        run: |
          # Lấy raw URL gốc của repo (GitHub hoặc Gitea)
          REPO_URL="https://raw.githubusercontent.com/${{ github.repository }}/main"

          cat > install.sh << 'SCRIPT_EOF'
          #!/usr/bin/env bash
          # ============================================================
          # NITS Platform — Remote Installer
          # Chạy: curl -fsSL <URL>/install.sh | bash
          # Hoặc:  curl -fsSL <URL>/install.sh -o install.sh && bash install.sh
          # ============================================================
          set -euo pipefail

          REPO_URL="REPO_URL_PLACEHOLDER"
          ANSIBLE_DIR="$(pwd)/nits-ansible"
          ROLES="k3s_uninstall k3s helm runtime_secrets cnpg argocd"

          RED='\033[0;31m'; GREEN='\033[0;32m'; YELLOW='\033[1;33m'
          BLUE='\033[0;34m'; NC='\033[0m'

          info()    { echo -e "${BLUE}[INFO]${NC}  $*"; }
          success() { echo -e "${GREEN}[OK]${NC}    $*"; }
          warn()    { echo -e "${YELLOW}[WARN]${NC}  $*"; }
          die()     { echo -e "${RED}[ERROR]${NC} $*" >&2; exit 1; }

          # ── Kiểm tra prerequisites ──────────────────────────────────
          info "Checking prerequisites..."
          command -v ansible-playbook >/dev/null 2>&1 || \
            die "ansible-playbook not found. Install: pip install ansible"
          command -v curl >/dev/null 2>&1 || die "curl not found."

          # ── Tải playbook files ──────────────────────────────────────
          info "Downloading Ansible playbook to ${ANSIBLE_DIR}..."
          mkdir -p "${ANSIBLE_DIR}"

          # Helper: download a file, create parent dirs
          fetch() {
            local src="$1" dst="$2"
            mkdir -p "$(dirname "${dst}")"
            curl -fsSL "${REPO_URL}/ansible/${src}" -o "${dst}"
          }

          # Core files
          fetch "site.yml"       "${ANSIBLE_DIR}/site.yml"
          fetch "uninstall.yml"  "${ANSIBLE_DIR}/uninstall.yml"
          fetch "inventory/hosts.yml" "${ANSIBLE_DIR}/inventory/hosts.yml"
          fetch "group_vars/all.yml"  "${ANSIBLE_DIR}/group_vars/all.yml"

          # Roles
          for role in ${ROLES}; do
            fetch "roles/${role}/tasks/main.yml" \
                  "${ANSIBLE_DIR}/roles/${role}/tasks/main.yml"
          done

          success "Playbook downloaded to ${ANSIBLE_DIR}"

          # ── Prompt: environment secrets ───────────────────────────────────────
          echo ""
          echo -e "${YELLOW}=== Runtime secrets ===${NC}"
          read -rp "Đường dẫn file .env (bỏ trống để tạo file mới): " ENV_FILE
          if [[ -n "${ENV_FILE}" ]]; then
            [[ -f "${ENV_FILE}" ]] || die "Không tìm thấy file ${ENV_FILE}."
            cp "${ENV_FILE}" "${ANSIBLE_DIR}/../.env"
            chmod 600 "${ANSIBLE_DIR}/../.env"
            success "Environment secrets copied."
          else
            warn "Hãy tạo ${ANSIBLE_DIR}/../.env trước khi chạy playbook."
          fi

          # ── Confirm and run ─────────────────────────────────────────
          echo ""
          echo -e "${YELLOW}Chuẩn bị chạy:${NC}"
          echo "  ansible-playbook -i inventory/hosts.yml site.yml -K"
          echo ""
          read -rp "Tiến hành cài đặt? [y/N] " CONFIRM
          if [[ "${CONFIRM,,}" != "y" ]]; then
            info "Cancelled. Playbook đã được tải về ${ANSIBLE_DIR}"
            info "Chạy thủ công:"
            echo "  cd ${ANSIBLE_DIR}"
            echo "  ansible-playbook -i inventory/hosts.yml site.yml -K"
            exit 0
          fi

          cd "${ANSIBLE_DIR}"
          info "Running Ansible playbook..."
          ansible-playbook -i inventory/hosts.yml site.yml -K

          success "Installation complete!"
          echo ""
          echo -e "${GREEN}ArgoCD UI  :${NC} https://localhost:<NodePort>"
          echo -e "${GREEN}Username   :${NC} admin"
          echo -e "${GREEN}Password   :${NC} nits@2026"
          SCRIPT_EOF

          # Thay placeholder bằng URL thật
          sed -i "s|REPO_URL_PLACEHOLDER|${REPO_URL}|g" install.sh
          chmod +x install.sh

      - name: Upload install.sh as artifact
        uses: actions/upload-artifact@v4
        with:
          name: install-script
          path: install.sh

      - name: Attach install.sh to GitHub Release tag
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: install.sh
          tag_name: ${{ github.ref_name }}

      - name: Commit install.sh to repo (main branch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Đặt install.sh ở root repo để dễ truy cập qua raw URL
          cp install.sh install.sh

          git add install.sh
          git diff --staged --quiet && \
            echo "install.sh unchanged, skipping commit." || \
            git commit -m "chore: regenerate install.sh [skip ci]" && \
            git push

      - name: Generate Job Summary
        run: |
          REPO_URL="https://raw.githubusercontent.com/${{ github.repository }}/main"
          echo "### 📦 Install Script Generated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Cài đặt từ xa bằng một lệnh:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "curl -fsSL ${REPO_URL}/install.sh | bash" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Hoặc tải về xem trước:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "curl -fsSL ${REPO_URL}/install.sh -o install.sh && bash install.sh" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
