name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*", "v*" ]
    paths:
      - 'gitea/**'
      - '.github/workflows/ci.yaml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'gitea/**'
      - '.github/workflows/ci.yaml'
  release:
    types: [ published ]

env:
  REGISTRY: ghcr.io

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      security-events: write # Cần thiết nếu muốn đẩy report scan lên Security tab của GitHub

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set variables
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=$REPO" >> $GITHUB_ENV
          
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # Nếu là PR thì lấy prefix pr- kèm theo số ID của PR
            echo "IMAGE_TAG=pr-${{ github.event.pull_request.number }}" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # Nếu là Release / Tag thì lấy đúng tên tag đó
            echo "IMAGE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            # Nếu push lên nhánh main thì lấy thời gian commit (Format: YYYY-MM-DD_HHhMMmSSs)
            COMMIT_TIME=$(git log -1 --format=%cd --date=format:"%Y-%m-%d_%Hh%Mm%Ss")
            echo "IMAGE_TAG=${COMMIT_TIME}" >> $GITHUB_ENV
          fi

      - name: Build Docker image
        # Build image cục bộ để Trivy quét trước khi push
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:local -f gitea/Dockerfile ./gitea

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_NAME }}:local'
          format: 'table'
          exit-code: '0' # Đổi thành '1' nếu bạn muốn fail pipeline khi phát hiện lỗi CRITICAL
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Log in to the Container registry
        # Chỉ login và push khi merge vào nhánh main (không push khi tạo PR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and Push Docker image
        if: github.event_name != 'pull_request'
        run: |
          docker tag ${{ env.IMAGE_NAME }}:local ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker tag ${{ env.IMAGE_NAME }}:local ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} --all-tags

      - name: Update Helm chart values and commit
        if: github.event_name != 'pull_request'
        run: |
          # Cập nhật image tag trong file values.yaml
          sed -i -E 's/^(\s*tag:\s*).*$/\1"${{ env.IMAGE_TAG }}"/' gitea/helm-chart/values.yaml
          
          # Commit và push thay đổi lên repository
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gitea/helm-chart/values.yaml
          git commit -m "chore(gitea): update image tag to ${{ env.IMAGE_TAG }} [skip ci]" || echo "No changes to commit"
          git push
