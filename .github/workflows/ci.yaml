name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*", "v*" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [ published ]

env:
  REGISTRY: ghcr.io
  # Chỉnh sửa tên image theo ý bạn
  IMAGE_NAME: ${{ github.repository_owner }}/gitptit

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write # Cần thiết nếu muốn đẩy report scan lên Security tab của GitHub

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        # Build image cục bộ để Trivy quét trước khi push
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:local -f gitea/Dockerfile ./gitea

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_NAME }}:local'
          format: 'table'
          exit-code: '0' # Đổi thành '1' nếu bạn muốn fail pipeline khi phát hiện lỗi CRITICAL
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Log in to the Container registry
        # Chỉ login và push khi merge vào nhánh main (không push khi tạo PR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and Push Docker image
        if: github.event_name != 'pull_request'
        run: |
          docker tag ${{ env.IMAGE_NAME }}:local ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker tag ${{ env.IMAGE_NAME }}:local ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          
          # Nếu được trigger bằng Tag hoặc Release, tạo thêm image tag tương ứng
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            docker tag ${{ env.IMAGE_NAME }}:local ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$VERSION
          fi
          
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} --all-tags
