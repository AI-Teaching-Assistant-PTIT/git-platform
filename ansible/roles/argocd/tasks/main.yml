---
# roles/argocd/tasks/main.yml
# Cài ArgoCD + apply ApplicationSet

- name: Create ArgoCD namespace
  command: kubectl create namespace {{ argocd_namespace }}
  environment:
    KUBECONFIG: "{{ kubeconfig_user }}"
  register: ns_create
  changed_when: ns_create.rc == 0
  failed_when: ns_create.rc != 0 and 'already exists' not in ns_create.stderr

- name: Install ArgoCD {{ argocd_version }}
  command: >
    kubectl apply -n {{ argocd_namespace }}
    -f https://raw.githubusercontent.com/argoproj/argo-cd/{{ argocd_version }}/manifests/install.yaml
  environment:
    KUBECONFIG: "{{ kubeconfig_user }}"
  register: argocd_apply
  changed_when: "'configured' in argocd_apply.stdout or 'created' in argocd_apply.stdout"

- name: Wait for ArgoCD server to be ready
  command: >
    kubectl rollout status deployment/argocd-server
    -n {{ argocd_namespace }} --timeout=180s
  environment:
    KUBECONFIG: "{{ kubeconfig_user }}"
  changed_when: false

- name: Wait for ArgoCD application-controller to be ready
  command: >
    kubectl rollout status statefulset/argocd-application-controller
    -n {{ argocd_namespace }} --timeout=180s
  environment:
    KUBECONFIG: "{{ kubeconfig_user }}"
  changed_when: false

# ── ArgoCD CLI ──────────────────────────────────────────────────────────────────

- name: Check argocd CLI
  command: argocd version --client --short
  register: argocd_cli
  changed_when: false
  failed_when: false

- name: Download argocd CLI {{ argocd_version }}
  get_url:
    url: "https://github.com/argoproj/argo-cd/releases/download/{{ argocd_version }}/argocd-linux-amd64"
    dest: /usr/local/bin/argocd
    mode: '0755'
  become: true
  when: argocd_cli.rc != 0 or argocd_version not in (argocd_cli.stdout | default(''))

# ── Expose + set password ───────────────────────────────────────────────────────

- name: Patch ArgoCD server service to NodePort for local access
  command: >
    kubectl patch svc argocd-server -n {{ argocd_namespace }}
    -p '{"spec": {"type": "NodePort"}}'
  environment:
    KUBECONFIG: "{{ kubeconfig_user }}"
  register: svc_patch
  changed_when: "'patched' in svc_patch.stdout"
  failed_when: false

- name: Get ArgoCD NodePort
  command: >
    kubectl get svc argocd-server -n {{ argocd_namespace }}
    -o jsonpath='{.spec.ports[?(@.port==443)].nodePort}'
  environment:
    KUBECONFIG: "{{ kubeconfig_user }}"
  register: argocd_nodeport
  changed_when: false

- name: Get ArgoCD initial admin secret
  command: >
    kubectl get secret argocd-initial-admin-secret
    -n {{ argocd_namespace }}
    -o jsonpath='{.data.password}'
  environment:
    KUBECONFIG: "{{ kubeconfig_user }}"
  register: argocd_init_b64
  changed_when: false

- name: Decode initial admin password
  set_fact:
    argocd_init_password: "{{ argocd_init_b64.stdout | b64decode }}"

- name: Login to ArgoCD with initial password
  command: >
    argocd login localhost:{{ argocd_nodeport.stdout }}
    --username admin
    --password "{{ argocd_init_password }}"
    --insecure
  register: argocd_login
  changed_when: false
  failed_when: false

- name: Set ArgoCD admin password to "{{ argocd_admin_password }}"
  command: >
    argocd account update-password
    --current-password "{{ argocd_init_password }}"
    --new-password "{{ argocd_admin_password }}"
    --insecure
  register: pwd_update
  changed_when: "'Password updated' in pwd_update.stdout"
  failed_when: false
  when: argocd_login.rc == 0

- name: Display ArgoCD access info
  debug:
    msg:
      - "ArgoCD UI : https://localhost:{{ argocd_nodeport.stdout }}"
      - "Username  : admin"
      - "Password  : {{ argocd_admin_password }}"

# ── ArgoCD Repository Credentials ──────────────────────────────────────────────

- name: Tạo hoặc cập nhật credential repositories cho ArgoCD
  shell: |
    set -euo pipefail
    set -a
    . {{ secrets_env_file | quote }}
    set +a

    for secret_name in repo-git-platform repo-config; do
      case "$secret_name" in
        repo-git-platform) repo_url={{ git_platform_repo_url | quote }} ;;
        repo-config) repo_url={{ config_repo_url | quote }} ;;
      esac

      kubectl create secret generic "$secret_name" \
        --namespace {{ argocd_namespace }} \
        --from-literal=type=git \
        --from-literal=url="$repo_url" \
        --from-literal=username="$GHCR_USERNAME" \
        --from-literal=password="$GHCR_TOKEN" \
        --dry-run=client -o yaml | kubectl apply -f -
      kubectl label secret "$secret_name" \
        --namespace {{ argocd_namespace }} \
        argocd.argoproj.io/secret-type=repository \
        --overwrite
    done
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ kubeconfig_user }}"
  no_log: true

# ── ArgoCD ApplicationSet ───────────────────────────────────────────────────────

- name: Apply ArgoCD ApplicationSet
  command: kubectl apply -f {{ applicationset_file }}
  environment:
    KUBECONFIG: "{{ kubeconfig_user }}"
  register: appset_apply
  changed_when: "'configured' in appset_apply.stdout or 'created' in appset_apply.stdout"

- name: Restart ArgoCD controllers to sync ApplicationSet
  command: >
    kubectl rollout restart deployment/argocd-applicationset-controller deployment/argocd-repo-server
    -n {{ argocd_namespace }}
  environment:
    KUBECONFIG: "{{ kubeconfig_user }}"
  changed_when: false

- name: Show ApplicationSet status
  command: kubectl get applicationset -n {{ argocd_namespace }}
  environment:
    KUBECONFIG: "{{ kubeconfig_user }}"
  changed_when: false
  register: appset_status

- name: Display ApplicationSet status
  debug:
    var: appset_status.stdout_lines

- name: Show generated ArgoCD Applications
  command: kubectl get applications -n {{ argocd_namespace }}
  environment:
    KUBECONFIG: "{{ kubeconfig_user }}"
  changed_when: false
  register: app_list

- name: Display generated Applications
  debug:
    var: app_list.stdout_lines

