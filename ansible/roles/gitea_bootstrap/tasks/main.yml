---
# roles/gitea_bootstrap/tasks/main.yml
# Khởi tạo service account và token Gitea sau khi Argo CD đồng bộ Gitea.

- name: Chờ Gitea Deployment được Argo CD tạo
  command: >
    kubectl get deployment/{{ gitea_deployment_name }}
    --namespace {{ runtime_secrets_namespace }}
  environment:
    KUBECONFIG: "{{ kubeconfig_user }}"
  register: gitea_deployment
  changed_when: false
  retries: 60
  delay: 5
  until: gitea_deployment.rc == 0

- name: Chờ Gitea Deployment sẵn sàng
  command: >
    kubectl rollout status deployment/{{ gitea_deployment_name }}
    --namespace {{ runtime_secrets_namespace }}
    --timeout={{ gitea_bootstrap_timeout }}
  environment:
    KUBECONFIG: "{{ kubeconfig_user }}"
  changed_when: false

- name: Lấy pod Gitea đang chạy
  command: >
    kubectl get pods --namespace {{ runtime_secrets_namespace }}
    --selector app.kubernetes.io/name=gitea,app.kubernetes.io/instance=gitea-demo
    --field-selector=status.phase=Running
    --output jsonpath='{.items[0].metadata.name}'
  environment:
    KUBECONFIG: "{{ kubeconfig_user }}"
  register: gitea_pod
  changed_when: false
  failed_when: not gitea_pod.stdout

- name: Xác minh Gitea CLI bằng user git
  command:
    argv:
      - kubectl
      - exec
      - --namespace
      - "{{ runtime_secrets_namespace }}"
      - "{{ gitea_pod.stdout }}"
      - --
      - /bin/su
      - -s
      - /bin/sh
      - git
      - -c
      - >-
        gitea --config /data/gitea/conf/app.ini --work-path /data/gitea
        --custom-path /data/gitea --version
  environment:
    KUBECONFIG: "{{ kubeconfig_user }}"
  changed_when: false

- name: Kiểm tra service account Gitea đã tồn tại
  command:
    argv:
      - kubectl
      - exec
      - --namespace
      - "{{ runtime_secrets_namespace }}"
      - "{{ gitea_pod.stdout }}"
      - --
      - /bin/su
      - -s
      - /bin/sh
      - git
      - -c
      - >-
        gitea --config /data/gitea/conf/app.ini --work-path /data/gitea
        --custom-path /data/gitea admin user list
  environment:
    KUBECONFIG: "{{ kubeconfig_user }}"
  register: gitea_user_list
  changed_when: false
  no_log: true

- name: Tạo hoặc cập nhật Gitea integration token
  block:
    - name: Tạo hoặc cập nhật token Gitea
      script: bootstrap_token.sh
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_user }}"
        NAMESPACE: "{{ runtime_secrets_namespace }}"
        GITEA_POD: "{{ gitea_pod.stdout }}"
        USER_LIST: "{{ gitea_user_list.stdout }}"
        SERVICE_ACCOUNT: "{{ gitea_service_account }}"
        SERVICE_ACCOUNT_EMAIL: "{{ gitea_service_account_email }}"
        TOKEN_NAME: "{{ gitea_token_name }}"
        TOKEN_SCOPES: "{{ gitea_token_scopes }}"
      register: gitea_token_bootstrap
      changed_when: gitea_token_bootstrap.stdout | trim == 'created'
      no_log: true
  rescue:
    - name: Báo lỗi khởi tạo token Gitea đã che dữ liệu nhạy cảm
      fail:
        msg: >-
          Không thể khởi tạo Gitea integration token. Kiểm tra Gitea đã cài đặt hoàn tất,
          user git có thể đọc /data/gitea/conf/app.ini và service account chưa tồn tại khi token còn trống.

- name: Chờ workloads tiêu thụ token được Argo CD tạo
  command: >
    kubectl get deployment/{{ item }}
    --namespace {{ runtime_secrets_namespace }}
  loop:
    - backend-demo
    - code-index-worker-demo
  environment:
    KUBECONFIG: "{{ kubeconfig_user }}"
  register: gitea_token_consumers
  changed_when: false
  retries: 60
  delay: 5
  until: gitea_token_consumers.rc == 0

- name: Restart workloads sử dụng Gitea token
  command: >
    kubectl rollout restart deployment/{{ item }}
    --namespace {{ runtime_secrets_namespace }}
  loop:
    - backend-demo
    - code-index-worker-demo
  environment:
    KUBECONFIG: "{{ kubeconfig_user }}"
  when: gitea_token_bootstrap.changed
  changed_when: true

- name: Chờ workloads sử dụng Gitea token hoàn tất rollout
  command: >
    kubectl rollout status deployment/{{ item }}
    --namespace {{ runtime_secrets_namespace }}
    --timeout={{ gitea_bootstrap_timeout }}
  loop:
    - backend-demo
    - code-index-worker-demo
  environment:
    KUBECONFIG: "{{ kubeconfig_user }}"
  when: gitea_token_bootstrap.changed
  changed_when: false
