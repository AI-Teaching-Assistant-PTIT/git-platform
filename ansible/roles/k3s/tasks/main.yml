---
# roles/k3s/tasks/main.yml
# Cài đặt K3s single-node cluster

- name: 🔍 Kiểm tra trạng thái k3s
  block:
    - name: Kiểm tra k3s binary đã tồn tại chưa
      stat:
        path: /usr/local/bin/k3s
      register: k3s_bin

    - name: Lấy phiên bản k3s hiện tại
      command: k3s --version
      register: k3s_current_version
      changed_when: false
      failed_when: false
      when: k3s_bin.stat.exists
  tags: check

- name: ⚙️ Cài đặt và cập nhật k3s
  block:
    - name: Tải k3s binary (verify SHA256, tự động retry nếu rớt mạng)
      # Dùng get_url: tải vào file tạm, so khớp SHA256 rồi mới đưa vào vị trí (atomic).
      # checksum trỏ tới file sha256sum chính thức của đúng phiên bản; ansible tự khớp dòng "k3s".
      # Nếu binary trên đĩa bị hỏng/thiếu byte -> checksum lệch -> tự tải lại (self-heal),
      # thay vì cài đè một binary lỗi như cách curl -C - (resume) trước đây.
      get_url:
        url: "https://github.com/k3s-io/k3s/releases/download/{{ k3s_version | replace('+', '%2B') }}/k3s"
        dest: /usr/local/bin/k3s
        checksum: "sha256:https://github.com/k3s-io/k3s/releases/download/{{ k3s_version | replace('+', '%2B') }}/sha256sum-amd64.txt"
        mode: '0755'
        owner: root
        group: root
      become: true
      register: k3s_download
      retries: 10
      delay: 3
      until: k3s_download is succeeded

    - name: Chạy script cài đặt k3s (bỏ qua bước tải)
      shell: |
        curl -sfL https://get.k3s.io | INSTALL_K3S_SKIP_DOWNLOAD=true INSTALL_K3S_VERSION="{{ k3s_version }}" sh -s - {{ k3s_install_args | default('') }}
      become: true

  when: >
    not k3s_bin.stat.exists or
    k3s_version not in (k3s_current_version.stdout | default(''))
  tags: install

- name: 🔧 Cấu hình Kubeconfig cho user
  block:
    - name: Chờ k3s cluster chuyển sang trạng thái Ready
      command: kubectl get nodes
      register: nodes_ready
      retries: 20
      delay: 5
      until: "'Ready' in nodes_ready.stdout"
      environment:
        KUBECONFIG: "{{ kubeconfig | default('/etc/rancher/k3s/k3s.yaml') }}"
      become: true
      changed_when: false

    - name: Tạo thư mục .kube cho user
      file:
        path: "{{ ansible_env.HOME }}/.kube"
        state: directory
        mode: '0755'

    - name: Sao chép kubeconfig vào thư mục home
      copy:
        src: "{{ kubeconfig | default('/etc/rancher/k3s/k3s.yaml') }}"
        dest: "{{ ansible_env.HOME }}/.kube/config"
        remote_src: true
        mode: '0600'
        owner: "{{ ansible_user_id }}"
      become: true
      
    - name: Lưu trữ biến môi trường KUBECONFIG
      set_fact:
        kubeconfig_user: "{{ ansible_env.HOME }}/.kube/config"
  tags: kubeconfig

- name: 💾 Cấu hình StorageClass (local-path-provisioner)
  block:
    - name: Cài đặt local-path-provisioner
      command: >
        kubectl apply -f
        https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.30/deploy/local-path-storage.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig_user }}"
      register: lpp_result
      changed_when: "'configured' in lpp_result.stdout or 'created' in lpp_result.stdout"

    - name: Thiết lập local-path làm StorageClass mặc định
      command: >
        kubectl patch storageclass local-path
        -p '{"metadata": {"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}'
      environment:
        KUBECONFIG: "{{ kubeconfig_user }}"
      register: sc_patch
      changed_when: "'patched' in sc_patch.stdout"
      failed_when: false
  tags: storage