---
# site.yml — Master playbook: cài toàn bộ stack (idempotent)
# Chạy: ansible-playbook -i inventory/hosts.yml site.yml -K
# Gỡ k3s trước khi cài lại: ansible-playbook -i inventory/hosts.yml site.yml -K -e force_reinstall=true

- name: Setup K8s Platform
  hosts: all
  become: false
  gather_facts: true

  roles:
    - role: k3s_uninstall   # chỉ gỡ k3s khi force_reinstall=true
      when: force_reinstall | default(false) | bool
    - role: k3s             # cài k3s (skip nếu đúng version)
    - role: helm            # cài / verify Helm
    - role: runtime_secrets # tạo Kubernetes Secrets từ ../.env
    - role: cnpg            # CloudNative PG operator
    - role: argocd          # ArgoCD + set password + ApplicationSet
    - role: gitea_bootstrap # tạo service account/token sau khi Gitea sẵn sàng
