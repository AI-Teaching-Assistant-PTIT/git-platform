apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: git-platform-set
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/NguyenTuKien/platform-services.git
        revision: HEAD
        directories:
          - path: '*/helm-chart'
  template:
    metadata:
      name: '{{path.basename}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/NguyenTuKien/platform-services.git
        targetRevision: HEAD
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: default
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
