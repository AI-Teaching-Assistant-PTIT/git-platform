---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: webapp-secret
  annotations:
    argocd.argoproj.io/hook: PreSync
spec:
  encryptedData:
    {{- $keys := keys .Values.secret | sortAlpha }}
    {{- range $keys }}
    {{ . }}: {{ index $.Values.secret . | quote }}
    {{- end }}
  template:
    metadata:
      name: webapp-secret
