image:
  repository: ghcr.io/ai-teaching-assistant-ptit/backend
  tag: pr-6
  pullPolicy: IfNotPresent

imagePullSecrets: []
# imagePullSecrets:
#   - name: ghcr-secret

replicaCount: 1

env:
  DOMAIN: ""
  FRONTEND_HOST: ""
  ENVIRONMENT: "production"
  BACKEND_CORS_ORIGINS: ""
  PROJECT_NAME: "AI Teaching Assistant"
  POSTGRES_SERVER: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ""
  MINIO_ENDPOINT: "minio:9000"
  MINIO_BUCKET: "course-knowledge"
  MINIO_SECURE: "false"
  # SMTP
  SMTP_HOST: ""
  SMTP_USER: ""
  SMTP_PORT: "587"
  EMAILS_FROM_EMAIL: ""
  SENTRY_DSN: ""
  # AI / LLM
  NVIDIA_API_BASE_URL: "https://integrate.api.nvidia.com/v1"
  EMBEDDING_API_BASE_URL: ""
  EMBEDDING_API_KEY: ""
  EMBEDDING_MODEL: "sentence-transformers/all-MiniLM-L6-v2"
  EMBEDDING_DIMENSIONS: "384"
  LLM_CHAT_MODEL: "openai/gpt-oss-20b"
  LLM_MINI_MODEL: "meta/llama-3.1-8b-instruct"
  LLM_CALLBACK_MODEL: "openai/gpt-oss-120b"
  # Docling
  DOCLING_API_URL: "http://docling:5001"
  DOCLING_API_KEY: ""
  DOCLING_TIMEOUT_SECONDS: "3600"
  # Gitea
  GITEA_BASE_URL: ""
  GITEA_TOKEN: ""
  GITEA_ORG: ""
  GITEA_TIMEOUT_SECONDS: "20"

service:
  type: ClusterIP
  port: 8000

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
