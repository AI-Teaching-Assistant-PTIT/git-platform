image:
  repository: ghcr.io/ai-teaching-assistant-ptit/backend
  tag: pr-6
  pullPolicy: IfNotPresent

imagePullSecrets: []
# imagePullSecrets:
#   - name: ghcr-secret

replicaCount: 1

env:
  DOMAIN: ""
  FRONTEND_HOST: ""
  ENVIRONMENT: "production"
  BACKEND_CORS_ORIGINS: ""
  SECRET_KEY: ""
  FIRST_SUPERUSER: ""
  FIRST_SUPERUSER_PASSWORD: ""
  PROJECT_NAME: "AI Teaching Assistant"
  POSTGRES_SERVER: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ""
  POSTGRES_USER: ""
  POSTGRES_PASSWORD: ""
  MINIO_ENDPOINT: "minio:9000"
  MINIO_ACCESS_KEY: ""
  MINIO_SECRET_KEY: ""
  MINIO_BUCKET: "course-knowledge"

service:
  type: ClusterIP
  port: 8000

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
