services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    environment:
      - TZ=Asia/Ho_Chi_Minh
    depends_on:
      - gitea
    networks:
      - platform_net
  gitea:
    build: ./gitea
    image: ghcr.io/ai-teaching-assistant-ptit/git-platform:v0.0.2
    container_name: gitea
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - TZ=Asia/Ho_Chi_Minh
      - GITEA__APP_NAME=Git Platform
      - GITEA__server__DOMAIN
      - GITEA__server__ROOT_URL
      - GITEA__server__SSH_DOMAIN
      - GITEA__server__SSH_PORT=2222
      - GITEA__server__DISABLE_SSH=false
      - GITEA__server__LFS_START_SERVER=true
      - GITEA__service__DISABLE_REGISTRATION=false
      - GITEA__service__ALLOW_ONLY_EXTERNAL_REGISTRATION=true
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=postgres:5432
      - GITEA__database__NAME
      - GITEA__database__USER
      - GITEA__database__PASSWD
      - GITEA__server__LANDING_PAGE=explore
      - GITEA__actions__ENABLED=true
      - GITEA__oauth2_client__ACCOUNT_LINKING=auto
      - GITEA__oauth2_client__UPDATE_AVATAR=true
      - GITEA__oauth2_client__ENABLE_AUTO_REGISTRATION=true
      - GITEA__oauth2_client__USERNAME=preferred_username
      - GITEA__service__VALID_USERNAME_CHARS=a-zA-Z0-9_-.
    volumes:
      - gitea_data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"
      - "2222:22"
    networks:
      - platform_net

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - TZ=Asia/Ho_Chi_Minh
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - platform_net

  seaweedfs:
    image: chrislusf/seaweedfs:3.75
    container_name: seaweedfs
    command: >
      /bin/sh -c "
      mkdir -p /etc/seaweedfs &&
      echo '{\"identities\":[{\"name\":\"admin\",\"credentials\":[{\"accessKey\":\"$${S3_USER}\",\"secretKey\":\"$${S3_PASSWORD}\"}],\"actions\":[\"Admin\",\"Read\",\"Write\"]}]}' > /etc/seaweedfs/s3.json &&
      weed server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json
      "
    restart: unless-stopped
    environment:
      - S3_USER
      - S3_PASSWORD
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - seaweedfs_data:/data
    ports:
      - "9000:9000"
      - "9333:9333"
      - "8888:8888"
    networks:
      - platform_net

volumes:
  gitea_data:
  postgres_data:
  seaweedfs_data:

networks:
  platform_net:
    driver: bridge
