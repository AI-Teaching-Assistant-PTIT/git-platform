image:
  repository: quay.io/docling-project/docling-serve-cpu
  tag: v1.27.0
  pullPolicy: IfNotPresent

replicaCount: 1

env:
  DOCLING_SERVE_ENABLE_UI: "1"
  DOCLING_DEVICE: "cpu"
  DOCLING_SERVE_ENG_LOC_NUM_WORKERS: "1"

persistence:
  enabled: true
  size: 5Gi
  storageClass: ""
  accessMode: ReadWriteOnce

service:
  type: ClusterIP
  port: 5001

resources:
  requests:
    cpu: 1000m
    memory: 2Gi
  limits:
    cpu: 2000m
    memory: 4Gi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
