replicaCount: 1

strategy:
  type: Recreate

extraPorts:
  - name: ssh
    containerPort: 22
    protocol: TCP

persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 5Gi

image:
  repository: ghcr.io/ai-teaching-assistant-ptit/gitptit
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: "gitea"

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

initContainers: []

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 3000

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 30
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 5

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

volumes: []

volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}

# ConfigMap chỉ chứa những giá trị thay đổi theo môi trường. Mọi tuỳ chọn cố định của
# sản phẩm (branding, SSH, LFS, Actions, oauth2_client, INSTALL_LOCK, TZ, USER_UID/GID...)
# đã là ENV trong gitptit/Dockerfile nên không lặp lại ở đây; muốn đổi chính sách thì sửa
# Dockerfile để mọi môi trường nhận cùng một hành vi.
# Thông tin nhạy cảm (GITEA__database__USER, GITEA__database__PASSWD, GITEA_ADMIN_*, SSO_*)
# nằm trong Secret cùng tên với release, do Ansible role runtime_secrets tạo từ platform/.env.
config:
  GITEA__database__HOST: "postgres-rw:5432"
  GITEA__database__NAME: "gitptit"
  GITEA__database__SSL_MODE: "disable"
  GITEA__server__DOMAIN: "git.example.com"
  GITEA__server__ROOT_URL: "https://git.example.com/"
  GITEA__server__SSH_DOMAIN: "git.example.com"
