image:
  repository: ghcr.io/ai-teaching-assistant-ptit/backend
  tag: pr-6
  pullPolicy: IfNotPresent

imagePullSecrets: []
# imagePullSecrets:
#   - name: ghcr-secret

replicaCount: 1

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 80

command:
  - python
  - -m
  - app.knowledge.worker

env:
  POSTGRES_SERVER: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "assistant"
  MINIO_ENDPOINT: "minio:9000"
  PROJECT_NAME: "AI Assistant"
  MINIO_BUCKET: "course-knowledge"
  # Docling
  DOCLING_API_URL: "http://docling:5001"
  DOCLING_TIMEOUT_SECONDS: "3600"
  # AI / LLM
  NVIDIA_API_BASE_URL: "https://integrate.api.nvidia.com/v1"
  EMBEDDING_API_BASE_URL: ""
  EMBEDDING_MODEL: "sentence-transformers/all-MiniLM-L6-v2"
  EMBEDDING_DIMENSIONS: "384"
  LLM_CHAT_MODEL: "openai/gpt-oss-20b"
  LLM_MINI_MODEL: "meta/llama-3.1-8b-instruct"
  LLM_CALLBACK_MODEL: "openai/gpt-oss-120b"
