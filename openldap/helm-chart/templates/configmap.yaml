apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "helm-chart.fullname" . }}
  labels:
    {{- include "helm-chart.labels" . | nindent 4 }}
data:
  LDAP_ORGANISATION: {{ .Values.config.LDAP_ORGANISATION | quote }}
  LDAP_DOMAIN: {{ .Values.config.LDAP_DOMAIN | quote }}
  LDAP_BASE_DN: {{ .Values.config.LDAP_BASE_DN | quote }}
