{{- if .Values.cnpg.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "helm-chart.fullname" . }}
  labels:
    {{- include "helm-chart.labels" . | nindent 4 }}
spec:
  instances: {{ .Values.cnpg.instances | default 1 }}
  storage:
    size: {{ .Values.cnpg.storageSize | default "10Gi" }}
  bootstrap:
    initdb:
      database: {{ .Values.config.database }}
      owner: {{ .Values.config.owner }}
      secret:
        name: {{ include "helm-chart.fullname" . }}
  backup:
    barmanObjectStore:
      destinationPath: s3://postgres-backup/
      endpointURL: http://minio-stag:9000
      s3Credentials:
        accessKeyId:
          name: minio-secret
          key: MINIO_ROOT_USER
        secretAccessKey:
          name: minio-secret
          key: MINIO_ROOT_PASSWORD
      wal:
        compression: gzip

{{- end }}
