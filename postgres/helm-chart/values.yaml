replicaCount: 1

cnpg:
  enabled: true
  instances: 1
  storageSize: 10Gi
  storageClass: ""
  enablePodAntiAffinity: false
  topologyKey: "kubernetes.io/hostname"
  sharedBuffers: "128MB"
  backup:
    retentionPolicy: "30d"

image:
  repository: nginx
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: "postgres"

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 80

resources: {}

livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

autoscaling:
  enabled: false

volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}

config:
  owner: "admin"
  database: "gitptit"
  applicationDatabase: "assistant"
  TZ: "Asia/Ho_Chi_Minh"
