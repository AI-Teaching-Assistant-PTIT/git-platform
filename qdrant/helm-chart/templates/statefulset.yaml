apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "helm-chart.fullname" . }}
  labels:
    {{- include "helm-chart.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "helm-chart.fullname" . }}-headless
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "helm-chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "helm-chart.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "helm-chart.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if gt (int .Values.replicaCount) 1 }}
          # --uri bắt buộc phải truyền qua CLI flag khi cluster mode bật
          # Pod-0: chỉ --uri (tự tạo cluster mới)
          # Pod-1/2: --uri + --bootstrap trỏ vào Pod-0
          command: ["/bin/sh", "-c"]
          args:
            - |
              HEADLESS={{ include "helm-chart.fullname" . }}-headless.{{ .Release.Namespace }}.svc.cluster.local
              MY_URI="http://${MY_POD_NAME}.${HEADLESS}:6335"
              BOOTSTRAP_URI="http://{{ include "helm-chart.fullname" . }}-0.${HEADLESS}:6335"
              if [ "${MY_POD_NAME}" = "{{ include "helm-chart.fullname" . }}-0" ]; then
                exec ./qdrant --uri "${MY_URI}"
              else
                exec ./qdrant --uri "${MY_URI}" --bootstrap "${BOOTSTRAP_URI}"
              fi
          {{- end }}
          env:
            {{- if .Values.config }}
            {{- $keys := keys .Values.config | sortAlpha }}
            {{- range $keys }}
            - name: {{ . }}
              value: {{ index $.Values.config . | quote }}
            {{- end }}
            {{- end }}
            {{- if gt (int .Values.replicaCount) 1 }}
            # Distributed mode
            - name: QDRANT__CLUSTER__ENABLED
              value: "true"
            - name: QDRANT__CLUSTER__P2P__PORT
              value: "6335"
            # Dùng Downward API lấy tên pod để build URI trong command
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- end }}
          ports:
            {{- range .Values.service.ports }}
            - name: {{ .name }}
              containerPort: {{ .targetPort }}
              protocol: TCP
            {{- end }}
            {{- if gt (int .Values.replicaCount) 1 }}
            - name: p2p
              containerPort: 6335
              protocol: TCP
            {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /qdrant/storage
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass }}
        {{- end }}
